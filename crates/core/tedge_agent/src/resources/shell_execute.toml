operation = "shell_execute"

[init]
action = "proceed"
on_success = "executing"

[executing]
action = "proceed"
on_success = "run"

[run]
script = "tedge-shell-plugin --command ${.payload.command}"
timeout_second = 3600
on_success = "successful"
on_error = "failed"
on_kill = { status = "failed", reason = "Command timed out" }

[successful]
action = "cleanup"

[failed]
action = "cleanup"
