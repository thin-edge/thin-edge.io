operation = "freeze"
type = "service"

[init]
action = "proceed"
on_success = "executing"

[executing]
action = "proceed"
on_success = "execute"

[execute]
script = "tedge service ${.topic.operation} ${.payload.serviceName} --type ${.payload.serviceType}"
sudo = true
timeout_second = 180
on_exit.0 = "successful"
on_exit.1-255 = { status = "failed", reason = "The action failed, see the operation log for the reason" }
on_kill = { status = "failed", reason = "The action did not complete in time and was cancelled" }

[successful]
action = "cleanup"

[failed]
action = "cleanup"
