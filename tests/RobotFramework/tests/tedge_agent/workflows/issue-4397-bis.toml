operation = "issue-4397-bis"

[init]
action = "proceed"
on_success = "executing"

[executing]
operation = "sleep"
input.duration = "60"
on_exec = "waiting"

[waiting]
action = "await-operation-completion"
timeout_second = 1
on_timeout = { status = "failed", reason = "No response from sleep sub operation" }
on_success = "successful"

[successful]
action = "cleanup"

[failed]
action = "cleanup"
