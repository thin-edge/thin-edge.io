operation = "issue-4397"

[init]
action = "proceed"
on_success = "executing"

[executing]
operation = "unknown_op"
on_exec = "waiting"

[waiting]
action = "await-operation-completion"
timeout_second = 1
on_timeout = { status = "failed", reason = "No response from unknown_op" }
on_success = "successful"

[successful]
action = "cleanup"

[failed]
action = "cleanup"
